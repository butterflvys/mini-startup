<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | RE-LOOP</title>
    <meta name="description"
        content="Masuk ke akun RE-LOOP Anda untuk melanjutkan belanja cerdas, melihat histori perbandingan harga, dan rekomendasi AI.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page-body">
    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon"><img src="assets/logo.png" alt="RE-LOOP Logo"></div>
                <div class="logo-text"><span class="brand-title">RE - LOOP</span></div>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html#hero" class="nav-link">Home</a>
                <a href="index.html#hanya-untukmu" class="nav-link">Shop</a>
                <div class="nav-dropdown"><a href="index.html#kategori" class="nav-link">Categories</a></div>
                <a href="index.html#fitur" class="nav-link nav-ai-link">
                    <i class="ri-sparkles-fill ai-sparkle-icon"></i> AI Rekomendasi
                </a>
                <a href="index.html#campaign" class="nav-link">About</a>
                <a href="index.html#footer" class="nav-link">Contact</a>
            </nav>
            <div class="nav-search-wrapper">
                <input type="text" id="quickSearchInput" placeholder="Search products...">
                <button class="nav-search-btn" id="quickSearchBtn" title="Search"><i
                        class="ri-search-line"></i></button>
            </div>
            <div class="nav-actions">
                <button class="action-icon-btn" id="cartBtn" title="Keranjang Belanja">
                    <i class="ri-shopping-cart-2-line"></i>
                    <span class="cart-count">0</span>
                </button>
                <div class="notif-btn-wrapper">
                    <button class="action-icon-btn" title="Notifikasi"><i class="ri-notification-3-line"></i></button>
                </div>
                <a href="login.html" class="action-icon-btn" id="userProfileBtn" title="Masuk ke Akun">
                    <i class="ri-user-3-line"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="login-main-wrapper">
        <div class="login-center-grid">
            <!-- Left: Large Brand Logo & Title -->
            <div class="login-brand-col">
                <div class="login-brand-visual">
                    <img src="assets/home.png" alt="RE-LOOP Logo">
                </div>
                <div class="login-brand-text">R E - L O O P</div>
            </div>
        </div>

        <!-- Right: Floating Login Card -->
        <div class="login-form-col">
            <div class="login-form-card">
                <h1 class="login-card-title">LOG IN</h1>

                <form id="loginForm" class="login-form" novalidate>
                    <!-- Identifier Input (Phone / Username / Email) -->
                    <div class="form-field-group">
                        <input type="text" id="loginIdentifier" class="login-input-control"
                            placeholder="No. Handphone/ Username/Email" required autocomplete="username">
                    </div>

                    <!-- Password Input with Eye Toggle -->
                    <div class="form-field-group">
                        <div class="password-input-box">
                            <input type="password" id="loginPassword" class="login-input-control password-control"
                                placeholder="Password" required autocomplete="current-password">
                            <button type="button" class="password-eye-btn" id="togglePasswordBtn"
                                aria-label="Toggle password visibility" title="Lihat kata sandi">
                                <i class="ri-eye-close-line" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="forgot-pass-row">
                        <a href="#" class="forgot-pass-link" id="forgotPassLink">Lupa Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-login-submit" id="loginSubmitBtn">
                        <span>Log In</span>
                        <i class="ri-arrow-right-line"></i>
                    </button>
                </form>

                <!-- Bottom Sign Up Link -->
                <div class="login-card-footer">
                    <span>Don't have an account? </span>
                    <a href="#" class="signup-link" id="signupLink">Sign up</a>
                </div>
            </div>
        </div>
        </div>
    </main>

    <!-- Main Script -->
    <script src="script.js"></script>
</body>

</html>
