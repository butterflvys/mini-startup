<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | RE-LOOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #F9F8F5; /* Off-white background */
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            color: #1E293B;
        }

        /* Navbar */
        .ln-navbar {
            height: 70px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            border-bottom: 1px solid #F1F5F9;
        }
        .ln-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .ln-logo img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
        .ln-logo-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1E293B;
        }
        .ln-help {
            font-size: 0.85rem;
            font-weight: 600;
            color: #F2542D;
            text-decoration: none;
        }
        .ln-help:hover {
            text-decoration: underline;
        }

        /* Page Layout */
        .ln-page {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Left Panel */
        .ln-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .ln-left img {
            max-width: 80%;
            height: auto;
            margin-bottom: 30px;
        }
        .ln-brand-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 12px;
            color: #E85D2C;
            text-transform: uppercase;
            margin-left: 12px; /* compensate for letter spacing */
        }

        /* Right Panel */
        .ln-right {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Card */
        .ln-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        .ln-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1E293B;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Google Button */
        .ln-google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            background: #FFFFFF;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .ln-google-btn:hover {
            border-color: #F2542D;
            background: #FFF7F5;
            color: #F2542D;
        }

        /* Divider */
        .ln-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .ln-divider-line {
            flex: 1;
            height: 1px;
            background: #F1F5F9;
        }
        .ln-divider-text {
            font-size: 0.78rem;
            color: #94A3B8;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Form */
        .ln-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ln-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ln-input-wrap {
            position: relative;
            width: 100%;
        }

        .ln-input {
            width: 100%;
            padding: 16px 20px;
            background: #F4F7F9;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #1E293B;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: all 0.2s;
        }
        .ln-input::placeholder {
            color: #94A3B8;
            font-weight: 500;
        }
        .ln-input:focus {
            background: #FFFFFF;
            border-color: #F2542D;
            box-shadow: 0 0 0 3px rgba(242, 84, 45, 0.1);
        }
        .ln-input.err {
            border-color: #EF4444;
            background: #FFF5F5;
        }

        .ln-eye {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94A3B8;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }
        .ln-eye:hover {
            color: #F2542D;
        }

        .ln-err-msg {
            font-size: 0.76rem;
            color: #EF4444;
            display: none;
            margin-left: 6px;
        }
        .ln-err-msg.show {
            display: block;
        }

        .ln-forgot {
            font-size: 0.8rem;
            font-weight: 700;
            color: #E85D2C;
            text-align: right;
            text-decoration: none;
            margin-top: -6px;
            margin-bottom: 8px;
        }
        .ln-forgot:hover {
            text-decoration: underline;
        }

        .ln-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #FA7921, #E85D2C);
            color: #FFFFFF;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(232, 93, 44, 0.3);
        }
        .ln-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(232, 93, 44, 0.4);
        }
        .ln-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .ln-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #64748B;
            font-weight: 500;
        }
        .ln-footer a {
            color: #1754E6; /* Blueish link like in some designs, or keep orange */
            font-weight: 700;
            text-decoration: none;
        }
        .ln-footer a:hover {
            text-decoration: underline;
        }

        /* Toast */
        .ln-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10B981;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
            opacity: 0;
        }
        .ln-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media(max-width: 800px) {
            .ln-page { grid-template-columns: 1fr; }
            .ln-left { display: none; }
        }
    </style>
</head>
<body>

    <header class="ln-navbar">
        <a href="../index.html" class="ln-logo">
            <img src="../assets/logo.png" alt="RE-LOOP">
            <span class="ln-logo-text">Re-Loop</span>
        </a>
        <a href="#" class="ln-help">Butuh bantuan?</a>
    </header>

    <div class="ln-page">
        <!-- Left Panel -->
        <div class="ln-left">
            <img src="../assets/home.png" alt="Shopping Cart on Laptop">
            <div class="ln-brand-text">R E - L O O P</div>
        </div>

        <!-- Right Panel (Form) -->
        <div class="ln-right">
            <div class="ln-card">
                <h1 class="ln-title">LOG IN</h1>

                <!-- Google Button -->
                <button class="ln-google-btn" id="googleLoginBtn" type="button">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M17.64 9.205C17.64 8.566 17.583 7.953 17.476 7.364H9V10.845H13.844C13.635 11.97 13.001 12.923 12.048 13.561V15.82H14.956C16.658 14.253 17.64 11.946 17.64 9.205Z" fill="#4285F4"/>
                        <path d="M9 18C11.43 18 13.467 17.194 14.956 15.82L12.048 13.561C11.242 14.101 10.211 14.42 9 14.42C6.656 14.42 4.672 12.837 3.964 10.71H0.957V13.042C2.438 15.983 5.482 18 9 18Z" fill="#34A853"/>
                        <path d="M3.964 10.71C3.784 10.17 3.682 9.593 3.682 9C3.682 8.407 3.784 7.83 3.964 7.29V4.958H0.957C0.348 6.173 0 7.548 0 9C0 10.452 0.348 11.827 0.957 13.042L3.964 10.71Z" fill="#FBBC05"/>
                        <path d="M9 3.58C10.321 3.58 11.508 4.034 12.441 4.925L15.022 2.344C13.463 0.892 11.426 0 9 0C5.482 0 2.438 2.017 0.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>

                <!-- Divider -->
                <div class="ln-divider">
                    <div class="ln-divider-line"></div>
                    <span class="ln-divider-text">atau dengan email</span>
                    <div class="ln-divider-line"></div>
                </div>

                <form id="loginForm" class="ln-form" novalidate>
                    <div class="ln-field">
                        <div class="ln-input-wrap">
                            <input type="text" id="loginIdentifier" class="ln-input" placeholder="No. Handphone/ Username/Email" required autocomplete="username">
                        </div>
                        <span class="ln-err-msg" id="errId">Kolom ini wajib diisi.</span>
                    </div>

                    <div class="ln-field">
                        <div class="ln-input-wrap">
                            <input type="password" id="loginPassword" class="ln-input" placeholder="Password" required autocomplete="current-password">
                            <button type="button" class="ln-eye" id="togglePw" title="Lihat Password">
                                <i class="ri-eye-close-line" id="eyeIcon"></i>
                            </button>
                        </div>
                        <span class="ln-err-msg" id="errPw">Password wajib diisi.</span>
                    </div>

                    <a href="#" class="ln-forgot" id="forgotPassLink">Lupa Password?</a>

                    <button type="submit" class="ln-submit" id="loginSubmitBtn">
                        <span>Log In</span>
                        <i class="ri-arrow-right-line"></i>
                    </button>
                </form>

                <div class="ln-footer">
                    Don't have an account? <a href="#" id="signupLink">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <div class="ln-toast" id="loginToast">
        <i class="ri-checkbox-circle-fill"></i>
        <span id="toastMsg">Login berhasil!</span>
    </div>

    <script src="../js/script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {

        function goToPreference(user) {
            sessionStorage.setItem('reloop_logged_in', 'true');
            sessionStorage.setItem('reloop_user', user);
            var toast = document.getElementById('loginToast');
            if (toast) { toast.classList.add('show'); }
            setTimeout(function() {
                window.location.href = 'onboarding.html';
            }, 900);
        }

        // Toggle password
        var togglePw = document.getElementById('togglePw');
        var pwdInput = document.getElementById('loginPassword');
        var eyeIcon = document.getElementById('eyeIcon');
        if (togglePw) {
            togglePw.addEventListener('click', function() {
                var isHidden = pwdInput.type === 'password';
                pwdInput.type = isHidden ? 'text' : 'password';
                eyeIcon.className = isHidden ? 'ri-eye-line' : 'ri-eye-close-line';
            });
        }

        // Validate
        function validate(input, errEl, msg) {
            if (!input.value.trim()) {
                input.classList.add('err');
                errEl.textContent = msg;
                errEl.classList.add('show');
                return false;
            }
            input.classList.remove('err');
            errEl.classList.remove('show');
            return true;
        }

        var idInput = document.getElementById('loginIdentifier');
        var errId = document.getElementById('errId');
        var errPw = document.getElementById('errPw');

        idInput.addEventListener('input', function() { idInput.classList.remove('err'); errId.classList.remove('show'); });
        pwdInput.addEventListener('input', function() { pwdInput.classList.remove('err'); errPw.classList.remove('show'); });

        // Form Submit
        var loginForm = document.getElementById('loginForm');
        var submitBtn = document.getElementById('loginSubmitBtn');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                var ok1 = validate(idInput, errId, 'Email / nomor HP wajib diisi.');
                var ok2 = validate(pwdInput, errPw, 'Password wajib diisi.');
                if (!ok1 || !ok2) return;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i><span>Log In...</span>';
                setTimeout(function() {
                    goToPreference(idInput.value.trim());
                }, 800);
            });
        }

        // Google
        var googleBtn = document.getElementById('googleLoginBtn');
        if (googleBtn) {
            googleBtn.addEventListener('click', function() {
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Menghubungkan...';
                setTimeout(function() {
                    goToPreference('google_user@gmail.com');
                }, 1000);
            });
        }

        // Forgot
        var forgotLink = document.getElementById('forgotPassLink');
        if (forgotLink) {
            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                var email = prompt('Masukkan email atau nomor HP untuk reset password:');
                if (email && email.trim()) {
                    alert('Tautan reset telah dikirim ke: ' + email.trim());
                }
            });
        }

        // Sign Up
        var signupLink = document.getElementById('signupLink');
        if (signupLink) {
            signupLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Daftar akun RE-LOOP gratis!\n\nMasukkan data Anda di form untuk mulai mendaftar.');
                idInput.focus();
                idInput.placeholder = 'Email / no. HP baru';
            });
        }

    });
    </script>
</body>
</html>
