<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | RE-LOOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="checkout-page-body">

    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <div class="logo-icon"><img src="../assets/logo.png" alt="RE-LOOP Logo"></div>
                <div class="logo-text"><span class="brand-title">RE - LOOP</span></div>
            </a>
                        <nav class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="shop.html" class="nav-link" id="shopNavLink">Shop</a>
                <div class="nav-dropdown">
                    <a href="category.html" class="nav-link">Categories</a>
                </div>
                <a href="top-products.html" class="nav-link nav-ai-link">
                    <i class="ri-sparkles-fill ai-sparkle-icon"></i> AI Rekomendasi
                </a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div class="nav-search-wrapper">
                <input type="text" id="quickSearchInput" placeholder="Search products...">
                <button class="nav-search-btn" id="quickSearchBtn" title="Search"><i class="ri-search-line"></i></button>
            </div>
            <div class="nav-actions">
                <button class="action-icon-btn" id="cartBtn" title="Shopping Cart">
                    <i class="ri-shopping-cart-2-line"></i>
                    <span class="cart-count">0</span>
                </button>
                <div class="notif-btn-wrapper">
                    <button class="action-icon-btn" title="Notifications"><i class="ri-notification-3-line"></i></button>
                </div>
                <a href="login.html" class="action-icon-btn" id="userProfileBtn" title="Login to Account">
                    <i class="ri-user-3-line"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="checkout-main">
        <div class="checkout-container">
            
            <div class="checkout-header-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h1 class="checkout-page-title" style="margin-bottom: 0;">Checkout</h1>
                    <a href="cart.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600; display: flex; align-items: center; gap: 8px;">
                        <i class="ri-arrow-left-line"></i> Kembali ke Keranjang
                    </a>
                </div>
                <div class="checkout-stepper">
                    <div class="step active">
                        <span class="step-num">1</span>
                        <span class="step-label">Pengiriman</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step">
                        <span class="step-num">2</span>
                        <span class="step-label">Pembayaran</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step">
                        <span class="step-num">3</span>
                        <span class="step-label">Review</span>
                    </div>
                </div>
            </div>

            <div class="checkout-layout">
                <!-- Left Column: Form -->
                <div class="checkout-left-col">
                    
                    <div class="checkout-section">
                        <h2 class="checkout-section-title">Contact Information</h2>
                        <div class="checkout-form-group">
                            <label>Nama Penerima</label>
                            <input type="text" class="checkout-input" value="Penerima">
                        </div>
                        <div class="checkout-form-group">
                            <label>Email</label>
                            <input type="email" class="checkout-input" value="your@email.com">
                        </div>
                        <div class="checkout-form-group">
                            <label>No. Telp</label>
                            <input type="tel" class="checkout-input" value="+6281384930322">
                        </div>
                    </div>

                    <div class="checkout-section">
                        <h2 class="checkout-section-title">Shipping Address</h2>
                        <div class="checkout-form-group">
                            <label>Alamat Pengiriman</label>
                            <textarea class="checkout-input checkout-textarea" rows="2">Jalan Bojong Soang II Blok Dn No 6, Cinere (Blok DN no 89), Depok, JAWA BARAT, ID 16913</textarea>
                        </div>
                        
                        <div class="checkout-row-group">
                            <div class="checkout-form-group">
                                <label>Kota</label>
                                <input type="text" class="checkout-input" value="Depok">
                            </div>
                            <div class="checkout-form-group">
                                <label>Provinsi</label>
                                <input type="text" class="checkout-input" value="Jawa Barat">
                            </div>
                        </div>

                        <div class="checkout-row-group">
                            <div class="checkout-form-group">
                                <label>Kode Pos</label>
                                <input type="text" class="checkout-input" value="16913">
                            </div>
                            <div class="checkout-form-group">
                                <label>Negara</label>
                                <input type="text" class="checkout-input" value="ID">
                            </div>
                        </div>

                        <label class="checkout-checkbox-label">
                            <input type="checkbox" checked>
                            <span class="checkout-checkbox-custom"></span>
                            Simpan data ini untuk lain waktu
                        </label>
                    </div>

                    <div class="checkout-actions">
                        <button class="checkout-continue-btn" id="proceedToPayBtn">
                            Continue ke Pembayaran <i class="ri-arrow-right-line"></i>
                        </button>
                    </div>
                </div>

                <!-- Right Column: Order Summary -->
                <div class="checkout-right-col">
                    <div class="checkout-summary-box">
                        <h2 class="checkout-summary-title">Pesanan Anda</h2>
                        <div class="checkout-items-list" id="checkoutItemsList">
                            <!-- Items will be populated here via JS -->
                        </div>
                        
                        <div class="checkout-summary-divider"></div>
                        
                        <div class="checkout-summary-row">
                            <span class="summary-label">Subtotal</span>
                            <span class="summary-val" id="checkoutSubtotal">Rp 0</span>
                        </div>
                        <div class="checkout-summary-row">
                            <span class="summary-label">Ongkir</span>
                            <span class="summary-val-highlight" id="checkoutShipping">Gratis</span>
                        </div>
                        
                        <div class="checkout-summary-total">
                            <span class="total-label">TOTAL</span>
                            <span class="total-val" id="checkoutTotal">Rp 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal dipindah ke payment.html -->

    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            syncNavbarAuthState();
            initNotificationSystem();
            
            // Load and render cart items
            const cartItems = getCartItems().filter(i => i.selected !== false); // only checkout selected items
            const listEl = document.getElementById('checkoutItemsList');
            let subtotal = 0;

            if (cartItems.length === 0) {
                listEl.innerHTML = `
                    <div style="text-align:center; padding: 40px 10px;">
                        <i class="ri-shopping-cart-2-line" style="font-size: 48px; color: #CBD5E1; margin-bottom: 16px; display: block;"></i>
                        <p style="color:#94A3B8; margin-bottom: 24px; font-weight: 500;">Belum ada pesanan.</p>
                        <a href="../index.html" class="btn-outline-pill" style="display: inline-block; text-decoration: none;">Belanja Sekarang</a>
                    </div>
                `;
            } else {
                listEl.innerHTML = cartItems.map(item => {
                    subtotal += (item.price * item.qty);
                    return `
                        <div class="checkout-item-row">
                            <div class="checkout-item-img">
                                <img src="${getAssetPath(item.image)}" alt="${item.name}">
                            </div>
                            <div class="checkout-item-details">
                                <div class="checkout-item-name">${item.name}</div>
                                <div class="checkout-item-qty">Qty: ${item.qty}</div>
                                <div class="checkout-item-price">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Calculations
            let shipping = cartItems.length > 0 ? 0 : 0; // Assume free shipping for now or get from prev step
            let total = subtotal + shipping;
            
            document.getElementById('checkoutSubtotal').textContent = 'Rp ' + subtotal.toLocaleString('id-ID');
            document.getElementById('checkoutTotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('checkoutShipping').textContent = shipping === 0 ? '0' : ('Rp ' + shipping.toLocaleString('id-ID'));
            
            const badges = document.querySelectorAll('.cart-count');
            const totalQty = getCartItems().reduce((s, i) => s + (i.qty || 1), 0);
            badges.forEach(b => { b.textContent = totalQty; });

            // Button Action
            document.getElementById('proceedToPayBtn').addEventListener('click', () => {
                if(cartItems.length === 0) {
                    alert("Keranjang anda kosong!");
                    return;
                }
                window.location.href = 'payment.html';
            });
        });
    </script>
</body>
</html>
